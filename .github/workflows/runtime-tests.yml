name: Runtime policy tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-tests.yml"
      - ".gitignore"
      - "cmake/ProcessorImage.cmake"
      - "cmake/ProcessorC16Image.cmake"
      - "docs/**"
      - "firmware/**"
      - "host/**"
      - "processor/CMakeLists.txt"
      - "scripts/build.py"
      - "scripts/check_docs.py"
      - "scripts/package_workload.py"
      - "tests/build/**"
      - "tests/firmware/**"
      - "tests/host/**"
      - "tests/integration/**"
      - "tools/diagnostics/**"
  pull_request:
    paths:
      - ".github/workflows/runtime-tests.yml"
      - ".gitignore"
      - "cmake/ProcessorImage.cmake"
      - "cmake/ProcessorC16Image.cmake"
      - "docs/**"
      - "firmware/**"
      - "host/**"
      - "processor/CMakeLists.txt"
      - "scripts/build.py"
      - "scripts/check_docs.py"
      - "scripts/package_workload.py"
      - "tests/build/**"
      - "tests/firmware/**"
      - "tests/host/**"
      - "tests/integration/**"
      - "tools/diagnostics/**"
  workflow_dispatch:

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Host runtime tests
        run: python3 -m unittest discover -s tests/host/rp86 -t . -p 'test_*.py' -v

      - name: Run Host application tests
        run: |
          python3 -m unittest discover -s tests/host/apps/cli -t . -p 'test_*.py' -v
          python3 -m unittest discover -s tests/host/apps/remote -t . -p 'test_*.py' -v

      - name: Run firmware runtime policy tests
        run: python3 -m unittest discover -s tests/firmware/runtime -p 'test_*.py' -v

      - name: Run repository and cross-plane policy tests
        run: |
          python3 -m unittest discover -s tests/build -p 'test_*.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_*.py' -v

      - name: Validate repository documentation
        run: python3 scripts/check_docs.py
